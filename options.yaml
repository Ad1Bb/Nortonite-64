# Nortonite 64 · opcje motywu dla dodatku Theme Options (Artem Shpynov, Jono).
# Bez dodatku motyw działa na wartościach domyślnych z Constants.xaml i widoków.
# Teksty: LocKey wskazuje klucz z Localization/*.xaml; Name/Title to zapas po angielsku.

Presets:
    # Palety kolorów: każda nadpisuje role z Constants.xaml (kolory, pędzle i klucze
    # motywu domyślnego). Domyślna (NORTON) to wartości z Constants.xaml.
    NortnitePalette:
        Name: Color palette
        LocKey: LOCNortniteOptPalette
        Presets:
            Default:
                Name: NORTON
                LocKey: LOCNortnitePaletteNorton
            Bios:
                Name: BIOS
                LocKey: LOCNortnitePaletteBios
                Files:
                    - Options\PaletteBios.xaml
            MsDos:
                Name: MS-DOS
                LocKey: LOCNortnitePaletteMsDos
                Files:
                    - Options\PaletteMsDos.xaml
            Synthwave:
                Name: SYNTHWAVE
                LocKey: LOCNortnitePaletteSynthwave
                Files:
                    - Options\PaletteSynthwave.xaml
            Outrun:
                Name: OUTRUN
                LocKey: LOCNortnitePaletteOutrun
                Files:
                    - Options\PaletteOutrun.xaml
            Vaporwave:
                Name: VAPORWAVE
                LocKey: LOCNortnitePaletteVaporwave
                Files:
                    - Options\PaletteVaporwave.xaml
            Sunset:
                Name: SUNSET
                LocKey: LOCNortnitePaletteSunset
                Files:
                    - Options\PaletteSunset.xaml
            Arizona:
                Name: ARIZONA
                LocKey: LOCNortnitePaletteArizona
                Files:
                    - Options\PaletteArizona.xaml
    # Wielkość listy gier: wysokość wiersza, font i szerokości kolumn (domyślne w Constants.xaml)
    NortniteListSize:
        Name: Game list size
        LocKey: LOCNortniteOptListSize
        Presets:
            Default:
                Name: Normal
                LocKey: LOCNortniteOptListSizeNormal
            Compact:
                Name: Compact
                LocKey: LOCNortniteOptListSizeCompact
                Files:
                    - Options\ListSizeCompact.xaml
            Large:
                Name: Large
                LocKey: LOCNortniteOptListSizeLarge
                Files:
                    - Options\ListSizeLarge.xaml
    # Druga i trzecia kolumna listy gier: co pokazują (domyślnie biblioteka i czas gry, jak w makiecie).
    # Szablony komórek są w Constants.xaml (NortniteListCellStyle); presety ustawiają tylko nazwę trybu.
    NortniteListColumn:
        Name: Second list column
        LocKey: LOCNortniteOptListColumn
        Presets:
            Default:
                Name: Library
                LocKey: LOCNortniteColumnLibrary
            Platform:
                Name: Platform
                LocKey: LOCNortniteColumnPlatform
                Files:
                    - Options\ListColumn2_Platform.xaml
            Genre:
                Name: Genre
                LocKey: LOCNortniteColumnGenre
                Files:
                    - Options\ListColumn2_Genre.xaml
            Developer:
                Name: Developer
                LocKey: LOCNortniteColumnDeveloper
                Files:
                    - Options\ListColumn2_Developer.xaml
            Year:
                Name: Release year
                LocKey: LOCNortniteColumnYear
                Files:
                    - Options\ListColumn2_Year.xaml
            Added:
                Name: Added
                LocKey: LOCNortniteColumnAdded
                Files:
                    - Options\ListColumn2_Added.xaml
            LastPlayed:
                Name: Last played
                LocKey: LOCNortniteColumnLastPlayed
                Files:
                    - Options\ListColumn2_LastPlayed.xaml
            Time:
                Name: Time played
                LocKey: LOCNortniteColumnTime
                Files:
                    - Options\ListColumn2_Time.xaml
            Size:
                Name: Install size
                LocKey: LOCNortniteMemSize
                Files:
                    - Options\ListColumn2_Size.xaml
            Status:
                Name: Completion status
                LocKey: LOCNortniteColumnStatus
                Files:
                    - Options\ListColumn2_Status.xaml
            Community:
                Name: Player score
                LocKey: LOCNortniteScoreCommunityLong
                Files:
                    - Options\ListColumn2_Community.xaml
            Critic:
                Name: Critic score
                LocKey: LOCNortniteScoreCriticLong
                Files:
                    - Options\ListColumn2_Critic.xaml
            Hidden:
                Name: Hide
                LocKey: LOCNortniteOptHide
                Files:
                    - Options\ListColumn2_Hidden.xaml
    NortniteListColumn3:
        Name: Third list column
        LocKey: LOCNortniteOptListColumn3
        Presets:
            Default:
                Name: Time played
                LocKey: LOCNortniteColumnTime
            Library:
                Name: Library
                LocKey: LOCNortniteColumnLibrary
                Files:
                    - Options\ListColumn3_Library.xaml
            Platform:
                Name: Platform
                LocKey: LOCNortniteColumnPlatform
                Files:
                    - Options\ListColumn3_Platform.xaml
            Genre:
                Name: Genre
                LocKey: LOCNortniteColumnGenre
                Files:
                    - Options\ListColumn3_Genre.xaml
            Developer:
                Name: Developer
                LocKey: LOCNortniteColumnDeveloper
                Files:
                    - Options\ListColumn3_Developer.xaml
            Year:
                Name: Release year
                LocKey: LOCNortniteColumnYear
                Files:
                    - Options\ListColumn3_Year.xaml
            Added:
                Name: Added
                LocKey: LOCNortniteColumnAdded
                Files:
                    - Options\ListColumn3_Added.xaml
            LastPlayed:
                Name: Last played
                LocKey: LOCNortniteColumnLastPlayed
                Files:
                    - Options\ListColumn3_LastPlayed.xaml
            Size:
                Name: Install size
                LocKey: LOCNortniteMemSize
                Files:
                    - Options\ListColumn3_Size.xaml
            Status:
                Name: Completion status
                LocKey: LOCNortniteColumnStatus
                Files:
                    - Options\ListColumn3_Status.xaml
            Community:
                Name: Player score
                LocKey: LOCNortniteScoreCommunityLong
                Files:
                    - Options\ListColumn3_Community.xaml
            Critic:
                Name: Critic score
                LocKey: LOCNortniteScoreCriticLong
                Files:
                    - Options\ListColumn3_Critic.xaml
            Hidden:
                Name: Hide
                LocKey: LOCNortniteOptHide
                Files:
                    - Options\ListColumn3_Hidden.xaml
    # Pasek pod danymi gry (panel INFO i szczegóły). Przy braku danych wybranego źródła
    # wchodzi zastępstwo: HLTB → ocena graczy → ocena krytyków (styl NortniteBarModeStyle
    # w Constants.xaml); gdy nie ma żadnych danych, sekcja znika.
    NortniteInfoBar:
        Name: Bar below game info
        LocKey: LOCNortniteOptInfoBar
        Presets:
            Default:
                Name: HowLongToBeat
                LocKey: LOCNortniteHltbLong
            Community:
                Name: Player score
                LocKey: LOCNortniteScoreCommunityLong
                Files:
                    - Options\BarCommunity.xaml
            Critic:
                Name: Critic score
                LocKey: LOCNortniteScoreCriticLong
                Files:
                    - Options\BarCritic.xaml
            Hidden:
                Name: Hide
                LocKey: LOCNortniteOptHide
                Files:
                    - Options\BarHidden.xaml
    NortniteHltbTarget:
        Name: HowLongToBeat bar measures
        LocKey: LOCNortniteOptHltbTarget
        Presets:
            Default:
                Name: Main story
                LocKey: LOCNortniteOptHltbTargetMain
            MainExtra:
                Name: Main + extras
                LocKey: LOCNortniteOptHltbTargetExtra
                Files:
                    - Options\HltbTargetExtra.xaml
            Completionist:
                Name: Completionist
                LocKey: LOCNortniteOptHltbTargetCompletionist
                Files:
                    - Options\HltbTargetCompletionist.xaml

    # Opcje tak/nie są presetami, a nie zmiennymi (Variables): Theme Options 0.33 nie zapisuje
    # powrotu ostatniej zmienionej zmiennej do wartości domyślnej, a presety tego błędu nie mają.
    NortniteCmdPath:
        Name: Command line path
        LocKey: LOCNortniteOptCmdPath
        Presets:
            Default:
                Name: Game install folder
                LocKey: LOCNortniteOptCmdPathInstall
            PresetPath:
                Name: Preset path
                LocKey: LOCNortniteOptCmdPathPreset
                Files:
                    - Options\CmdPresetPath.xaml
    NortniteCursor:
        Name: Command line cursor
        LocKey: LOCNortniteOptCursor
        Presets:
            Default:
                Name: Blinking
                LocKey: LOCNortniteOptCursorBlinking
            Steady:
                Name: Steady
                LocKey: LOCNortniteOptCursorSteady
                Files:
                    - Options\CursorSteady.xaml

    # WYŁĄCZONE (2026-11-14): ekran uruchamiania gry jest na stałe ukryty i nie ma go w opcjach.
    # Playnite zawsze pokazuje ten ekran; motyw czyni go tylko przezroczystym
    # (NortniteGameStatusOpacity = 0 w Constants.xaml, używane w Views/GameStatus.xaml).
    # Żeby przywrócić wybór Ukryj/Pokazuj, wystarczy odkomentować blok poniżej: plik
    # Options\LaunchScreenOn.xaml i teksty LOCNortniteOptLaunchScreen/OptShow/OptHide
    # we wszystkich tłumaczeniach zostały na miejscu.
